<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PhraseShelf</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <nav id="tabs" class="tabs" aria-label="Tabs">
      <button id="add-tab" class="add-tab" title="New tab">+</button>
    </nav>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Filter this tab…  (Ctrl+F)" autocomplete="off" spellcheck="false">
      <span class="spacer"></span>
      <button id="import" class="tool-btn" title="Add tabs from a .json export or a .txt list (one “Title -> Content” per line)">Import…</button>
      <button id="export-all" class="tool-btn" title="Save every tab to a .json file">Export all…</button>
      <button id="theme" class="tool-btn" title="Theme: Auto follows your system. Click to switch.">◐ Auto</button>
    </div>
  </header>

  <div id="update-bar" class="update-bar" hidden>
    <span id="update-text"></span>
    <span class="spacer"></span>
    <button id="update-now" class="tool-btn primary-btn">Update now</button>
    <button id="update-later" class="tool-btn">Later</button>
  </div>

  <main id="grid" class="grid"></main>
  <p id="empty" class="empty" hidden></p>

  <footer class="hint">
    <span class="hint-text hint-mouse">Click to copy · Right-click or ✎ to edit · Drag to reorder (drop on a tab to move) · Ctrl+N new button · Ctrl+1–9 switch tabs · Closing hides to the tray</span>
    <span class="hint-text hint-touch">Tap to copy · Long-press or ✎ to edit</span>
    <span id="version" class="version"></span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="snippet-dlg">
    <form method="dialog" id="snippet-form">
      <h2 id="snippet-dlg-title">New button</h2>
      <label>Label
        <input name="label" required maxlength="80" autocomplete="off">
      </label>
      <label>Content to copy
        <textarea name="body" rows="7" required spellcheck="false"></textarea>
      </label>
      <label>Tab
        <select name="tab"></select>
      </label>
      <div class="dlg-actions">
        <button type="button" id="snippet-delete" class="danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="cancel">Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="tab-dlg">
    <form method="dialog" id="tab-form">
      <h2 id="tab-dlg-title">New tab</h2>
      <label>Tab name
        <input name="label" required maxlength="40" autocomplete="off">
      </label>
      <div class="field-label">Color</div>
      <div id="tab-colors" class="swatches" role="radiogroup" aria-label="Tab color"></div>
      <div class="dlg-actions">
        <button type="button" id="tab-delete" class="danger">Delete tab</button>
        <button type="button" id="tab-export">Export tab…</button>
        <span class="spacer"></span>
        <button type="button" class="cancel">Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dlg">
    <form method="dialog">
      <p id="confirm-msg"></p>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button value="cancel">Cancel</button>
        <button value="ok" class="danger">Delete</button>
      </div>
    </form>
  </dialog>

  <script src="main.js"></script>
</body>
</html>
