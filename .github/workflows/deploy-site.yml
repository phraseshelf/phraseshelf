# Rebuilds and deploys phraseshelf.app from main without making a release, e.g. after
# editing the privacy page. Run it from the Actions tab → Deploy site → Run workflow.
# (Releases deploy the site on their own; see release.yml.)

name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 scripts/build_web.py
      - name: Deploy to phraseshelf.app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
