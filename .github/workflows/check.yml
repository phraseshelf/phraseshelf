# Quick checks on every push and pull request (no secrets, no builds).
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check translations (ui/i18n)
        run: python3 scripts/check_i18n.py
      - name: Web build
        run: python3 scripts/build_web.py
